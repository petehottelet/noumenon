# Tool settings only: Noumenon is not an installable package.
# Offline test dependencies are listed in requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pin the rule set so a ruff release cannot change lint results by itself.
select = ["E4", "E7", "E9", "F"]
