<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Noumenon</title>
  <meta name="description" content="Classic code rain with the reference character set, original Smythe SVG glyphs, and a navigable 3D mode.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <canvas id="rain" aria-label="Green code rain mixing reference characters and original Smythe glyphs"></canvas>
  <header class="chrome"><a class="wordmark" href="https://github.com/petehottelet/smythe"><img src="wordmark.svg" alt="SMYTHE" width="196" height="31"></a><span id="mode-label">Noumenon</span><a class="credit" href="THIRD_PARTY_NOTICES.md">Based on m8e / Rezmason</a></header>
  <p id="load-status" role="status">Loading the rain…</p>
  <div class="movement" role="group" aria-label="Move through the rain">
    <button type="button" data-direction="ArrowLeft" aria-label="Move left" title="Move left"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M4 1h2v2H4v1h5v2H4v1h2v2H4V7H2V3h2Z"/></svg></button>
    <button type="button" data-direction="ArrowUp" aria-label="Move forward" title="Move forward"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M4 1h2v2h2v2h1v2H7V5H6v4H4V5H3v2H1V5h1V3h2Z"/></svg></button>
    <button type="button" data-direction="ArrowDown" aria-label="Move backward" title="Move backward"><svg viewBox="0 0 10 10" aria-hidden="true"><path transform="rotate(180 5 5)" d="M4 1h2v2h2v2h1v2H7V5H6v4H4V5H3v2H1V5h1V3h2Z"/></svg></button>
    <button type="button" data-direction="ArrowRight" aria-label="Move right" title="Move right"><svg viewBox="0 0 10 10" aria-hidden="true"><path transform="rotate(180 5 5)" d="M4 1h2v2H4v1h5v2H4v1h2v2H4V7H2V3h2Z"/></svg></button>
  </div>
  <button type="button" id="settings-corner" class="corner" aria-controls="hud" aria-describedby="corner-tip" aria-keyshortcuts="s" aria-expanded="false" aria-label="Open settings">
    <span class="gear" aria-hidden="true"><svg viewBox="0 -960 960 960" fill="currentColor"><path d="M370-80l-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg></span>
  </button>
  <div id="corner-tip" class="tip" role="tooltip" hidden>Click/tap in this corner to open settings</div>
  <section id="hud" class="hud hidden" aria-label="Settings" aria-hidden="true" inert>
    <div class="transport" id="transport">
      <button type="button" id="pause" class="primary" aria-pressed="false">Pause</button>
      <button type="button" id="mode" aria-pressed="false">Enter 3D</button>
      <button type="button" id="reset" title="Reset viewpoint (R)">Reset view</button>
      <button type="button" id="fullscreen" title="Fullscreen (F)">Fullscreen</button>
      <a class="button" href="catalog.html">All glyphs</a>
    </div>
    <div class="deck" id="settings-deck"></div>
    <div class="statusline">
      <span>Mode <b id="mode-read">Classic</b></span>
      <span>Glyphs <b>192 + 56</b></span>
      <span class="key-hint">Enter 3D to explore</span>
      <span class="shortcut">Press S to toggle settings</span>
      <span id="settings-status" class="status" role="status" aria-live="polite"></span>
    </div>
  </section>
  <noscript>This preview needs JavaScript. <a href="../catalog/contact-sheet-128.png">View the current 192-glyph contact sheet.</a></noscript>
  <script src="glyphs.js"></script>
  <script src="base-glyphs.js"></script>
  <script src="lib/regl.min.js"></script>
  <script src="lib/gl-matrix.js"></script>
  <script type="module" src="rain.js"></script>
</body>
</html>
